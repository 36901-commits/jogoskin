<!doctype html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Skins</title>

    <link rel="stylesheet" href="./assets/css/index.css">

</head>

<body>

    <main>

        <section id="login">

            <form action="./home.html">

                <h2>Login</h2>

                <input
                    type="email"
                    maxlength="70"
                    placeholder="E-mail"
                    required
                    class="campo"
                    name="femail"
                >

                <input
                    type="password"
                    maxlength="12"
                    minlength="8"
                    placeholder="Senha"
                    required
                    class="campo"
                    name="fsenha"
                >

                <button class="campo botao">
                    Login
                </button>

            </form>

        </section>

    </main>

</body>

</html>
